<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>카메라 모션 분리수거 놀이</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 유아 친화 한글 폰트: 주아체 & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@600;800&display=swap" rel="stylesheet">
  <!-- Google MediaPipe Hands CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 젤리 탄성 애니메이션 */
    @keyframes jellyPop {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.15, 0.88); }
      50% { transform: scale(0.92, 1.12); }
      75% { transform: scale(1.05, 0.96); }
    }
    .animate-jelly {
      animation: jellyPop 0.5s ease-out;
    }

    /* 별 파티클 팝 */
    @keyframes starPop {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(180deg); opacity: 0; }
    }
    .pop-star {
      position: absolute;
      pointer-events: none;
      animation: starPop 0.8s ease-out forwards;
      font-size: 28px;
      z-index: 50;
    }

    /* 다시 생각해보세요 팝업 애니메이션 */
    @keyframes gentleBounce {
      0% { transform: translate(-50%, -40%) scale(0.7); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(0.97); }
      40% { transform: translate(-50%, -50%) scale(1); }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
    }
    .wrong-popup-anim {
      animation: gentleBounce 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-emerald-100 via-teal-50 to-amber-50 min-h-screen text-slate-800 flex flex-col justify-between p-2 sm:p-4">

  <!-- 상단 상태바 -->
  <header class="w-full max-w-5xl mx-auto flex items-center justify-between bg-white/95 backdrop-blur-md rounded-3xl px-4 py-3 shadow-md border-4 border-emerald-300">
    <div class="flex items-center gap-2 sm:gap-3">
      <span class="text-3xl sm:text-4xl">🌱</span>
      <div>
        <h1 class="text-xl sm:text-2xl text-emerald-800 font-extrabold tracking-wide">신나는 모션 분리수거 놀이</h1>
        <p id="mode-badge" class="text-xs text-emerald-600 font-sans font-bold flex items-center gap-1">
          <span id="mode-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="mode-text">카메라 준비 중 (마우스/터치로도 가능해요!)</span>
        </p>
      </div>
    </div>

    <!-- 점수판 및 조작 버튼 -->
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-1.5 bg-amber-100 px-3 py-1.5 rounded-2xl border-2 border-amber-300 shadow-inner">
        <span class="text-2xl">⭐</span>
        <span id="score-display" class="text-xl sm:text-2xl text-amber-800 font-bold">0</span>
      </div>
      <!-- 새롭게 시작하기 (다시 시작) 버튼 -->
      <button id="reset-game-btn" title="처음부터 다시 시작해요!" class="px-3 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-2xl border-2 border-emerald-300 text-sm font-bold flex items-center gap-1 transition-all active:scale-95 shadow-sm">
        <span class="text-lg">🔄</span>
        <span class="hidden sm:inline">다시 시작</span>
      </button>
      <button id="camera-toggle-btn" class="px-3 py-1.5 bg-sky-100 hover:bg-sky-200 text-sky-800 rounded-2xl border-2 border-sky-300 text-sm font-bold flex items-center gap-1 transition-all active:scale-95">
        <span class="text-lg">📷</span>
        <span class="hidden sm:inline" id="cam-btn-text">카메라 켜기</span>
      </button>
      <button id="sound-btn" class="p-2 sm:px-3 sm:py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-2xl border-2 border-rose-300 text-sm font-bold flex items-center gap-1 transition-all active:scale-95">
        <span id="sound-icon" class="text-lg">🔔</span>
      </button>
    </div>
  </header>

  <!-- 메인 게임 뷰포트 (카메라 화면 & 캔버스 일체형) -->
  <main class="w-full max-w-5xl mx-auto my-auto flex flex-col items-center justify-center flex-grow py-2">
    
    <!-- 유아용 친절 안내 배너 (글씨 크기 확대 및 두께 강화) -->
    <div id="instruction-pill" class="mb-2 px-6 py-2.5 rounded-full bg-white border-4 border-emerald-400 shadow-md text-base sm:text-2xl text-emerald-900 font-extrabold flex items-center gap-2.5 transition-all">
      <span class="text-3xl animate-bounce">🖐️</span>
      <span id="instruction-text">카메라 앞에서 손을 들거나, 화면의 쓰레기를 콕 쥐어보세요!</span>
    </div>

    <!-- 인터랙티브 캔버스 컨테이너 (960x580 고정 비율 리사이즈) -->
    <div class="relative w-full max-w-4xl aspect-[16/10] bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 sm:border-8 border-white">
      <!-- 숨김 처리된 웹캠 비디오 엘리먼트 -->
      <video id="webcam-video" playsinline class="hidden"></video>
      
      <!-- 게임 메인 캔버스 -->
      <canvas id="game-canvas" width="960" height="600" class="w-full h-full block cursor-pointer"></canvas>

      <!-- 다시 생각해보세요 토스트 팝업 레이어 -->
      <div id="wrong-popup" class="hidden absolute top-1/2 left-1/2 pointer-events-none z-40 w-11/12 max-w-md bg-white/95 backdrop-blur-md rounded-3xl border-4 border-amber-400 p-5 shadow-2xl text-center">
        <div class="text-5xl mb-2 animate-bounce">🤔💡</div>
        <h3 class="text-2xl font-extrabold text-amber-900 mb-1">다시 한 번 생각해볼까요?</h3>
        <p id="wrong-popup-desc" class="text-sm sm:text-base font-sans font-bold text-slate-700 leading-snug">
          힌트를 보고 알맞은 통을 찾아보세요!
        </p>
      </div>

      <!-- 카메라 첫 허용 가이드 안내 레이어 -->
      <div id="cam-guide-overlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center text-white p-6 text-center transition-opacity duration-300">
        <div class="text-6xl mb-3 animate-pulse">✨🤖🖐️</div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-300 mb-2">손동작으로 즐기는 분리수거!</h2>
        <p class="text-sm sm:text-base text-slate-100 max-w-md font-sans mb-5 leading-relaxed">
          카메라를 켜고 <b>손가락을 오므려(주먹 쥐기)</b> 쓰레기를 잡은 뒤,<br>
          알맞은 통 위에서 <b>손을 쫙 펴면</b> 쏙 들어갑니다!
        </p>
        <div class="flex flex-wrap gap-3 justify-center">
          <button id="activate-cam-btn" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-transform flex items-center gap-2">
            <span>📷 카메라 켜고 시작</span>
          </button>
          <button id="use-mouse-btn" class="px-6 py-3 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-bold text-lg backdrop-blur-md active:scale-95 transition-transform">
            <span>🖱️ 마우스/터치로 먼저 놀기</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 교실 가이드 바 -->
  <footer class="w-full max-w-5xl mx-auto text-center py-1">
    <p class="text-xs sm:text-sm text-emerald-800/80 font-sans font-bold">
      💡 카메라 권한이 차단되었거나 인식이 어려울 때는 화면을 마우스로 클릭하거나 손가락 터치로 끌어다 넣을 수 있습니다.
    </p>
  </footer>

  <script>
    // ==========================================
    // 1. Web Audio 사운드 신시사이저
    // ==========================================
    let audioCtx = null;
    let isSoundOn = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!isSoundOn) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'grab') {
          // 뽁! 쥐는 효과음
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'success') {
          // 도-미-솔-도 맑은 실로폰 성공음
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + i * 0.07);
            g.gain.setValueAtTime(0.25, now + i * 0.07);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.3);
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start(now + i * 0.07);
            o.stop(now + i * 0.07 + 0.3);
          });
        } else if (type === 'oops') {
          // 부드러운 갸우뚱 음 (통~통)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.22);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ==========================================
    // 2. 분리수거 데이터 & 게임 요소 정의
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam-video');
    const instructionText = document.getElementById('instruction-text');
    const modeBadge = document.getElementById('mode-text');
    const modeDot = document.getElementById('mode-dot');
    const scoreDisplay = document.getElementById('score-display');
    const camGuideOverlay = document.getElementById('cam-guide-overlay');
    const wrongPopup = document.getElementById('wrong-popup');
    const wrongPopupDesc = document.getElementById('wrong-popup-desc');
    let wrongPopupTimer = null;

    let score = 0;
    let cameraActive = false;
    let cameraInstance = null;
    let handsInstance = null;

    // 하단 6개 쓰레기통 정의 (종이, 플라스틱, 캔, 유리, 비닐, 일반쓰레기)
    const BINS = [
      { id: 'paper', name: '종이', icon: '📦', color: '#8D6E63', darkColor: '#5D4037', lightColor: '#D7CCC8', x: 20, y: 430, w: 140, h: 155 },
      { id: 'plastic', name: '플라스틱', icon: '🧴', color: '#1E88E5', darkColor: '#1565C0', lightColor: '#BBDEFB', x: 176, y: 430, w: 140, h: 155 },
      { id: 'can', name: '캔류', icon: '🥫', color: '#FB8C00', darkColor: '#EF6C00', lightColor: '#FFE0B2', x: 332, y: 430, w: 140, h: 155 },
      { id: 'glass', name: '유리병', icon: '🍾', color: '#00897B', darkColor: '#00695C', lightColor: '#B2DFDB', x: 488, y: 430, w: 140, h: 155 },
      { id: 'vinyl', name: '비닐류', icon: '🛍️', color: '#8E24AA', darkColor: '#6A1B9A', lightColor: '#E1BEE7', x: 644, y: 430, w: 140, h: 155 },
      { id: 'trash', name: '일반쓰레기', icon: '🗑️', color: '#546E7A', darkColor: '#37474F', lightColor: '#CFD8DC', x: 800, y: 430, w: 140, h: 155 }
    ];

    // 유아용 쓰레기 아이템 풀 (총 20가지 아이템 및 교육용 함정 포함)
    const ITEMS_POOL = [
      // [1. 종이류 - 3종]
      { name: '깨끗한 신문지', category: 'paper', emoji: '📰', graphicId: 'newspaper', isTrap: false, tip: '신문지는 차곡차곡 종이 통으로!' },
      { name: '택배 상자', category: 'paper', emoji: '📦', graphicId: 'box', isTrap: false, tip: '테이프를 뗀 상자는 종이 나라로!' },
      { name: '우유팩', category: 'paper', emoji: '🧃', graphicId: 'milk', isTrap: false, tip: '물로 헹궈 쫙 편 우유팩은 종이류!' },

      // [2. 플라스틱류 - 3종]
      { name: '투명 생수병', category: 'plastic', emoji: '🧴', graphicId: 'pet_bottle', isTrap: false, tip: '라벨을 뗀 투명 페트병은 플라스틱!' },
      { name: '요구르트병', category: 'plastic', emoji: '🍼', graphicId: 'yogurt', isTrap: false, tip: '빨대를 쏙 빼고 플라스틱 통에 쏙!' },
      { name: '샴푸통', category: 'plastic', emoji: '🧴', graphicId: 'shampoo', isTrap: false, tip: '안을 깨끗이 헹군 샴푸통은 플라스틱!' },

      // [3. 캔류 - 3종]
      { name: '탄산음료 캔', category: 'can', emoji: '🥫', graphicId: 'soda_can', isTrap: false, tip: '알루미늄 캔은 캔류 수거함으로!' },
      { name: '참치 통조림캔', category: 'can', emoji: '🐟', graphicId: 'tuna_can', isTrap: false, tip: '기름기를 씻은 캔은 캔류로 쏙!' },
      { name: '옥수수 캔', category: 'can', emoji: '🌽', graphicId: 'food_can', isTrap: false, tip: '깨끗하게 비운 통조림 캔은 캔류!' },

      // [4. 유리병류 - 3종]
      { name: '주스 유리병', category: 'glass', emoji: '🍾', graphicId: 'juice_bottle', isTrap: false, tip: '뚜껑을 분리한 유리병은 유리 수거함으로!' },
      { name: '달콤한 잼병', category: 'glass', emoji: '🍯', graphicId: 'jam_jar', isTrap: false, tip: '물로 깨끗이 헹군 유리 잼병은 유리로!' },
      { name: '이유식 유리병', category: 'glass', emoji: '🫙', graphicId: 'baby_food', isTrap: false, tip: '깨끗한 작은 유리병도 유리통에 쏙!' },

      // [5. 비닐류 - 3종]
      { name: '투명 비닐봉지', category: 'vinyl', emoji: '🛍️', graphicId: 'plastic_bag', isTrap: false, tip: '바람을 쏙 빼서 비닐류에 모아요!' },
      { name: '뽁뽁이 완충재', category: 'vinyl', emoji: '🫧', graphicId: 'bubble_wrap', isTrap: false, tip: '에어캡 뽁뽁이는 비닐류로 분리배출!' },
      { name: '빵 포장 비닐', category: 'vinyl', emoji: '🍞', graphicId: 'bread_bag', isTrap: false, tip: '깨끗한 빵 비닐은 비닐류 바구니로!' },

      // [6. 일반쓰레기 & 함정 아이템 - 5종]
      { 
        name: '양념 묻은 배달용기', 
        category: 'trash', 
        emoji: '🥘', 
        graphicId: 'spicy_box',
        isTrap: true, 
        trapNotice: '빨간 양념 국물이 물든 플라스틱은 재활용 불가! [일반쓰레기]로 버려요!' 
      },
      { 
        name: '기름 묻은 피자박스', 
        category: 'trash', 
        emoji: '🍕', 
        graphicId: 'pizza_box',
        isTrap: true, 
        trapNotice: '기름과 치즈가 묻은 상자는 종이로 재활용할 수 없어요! [일반쓰레기]로 쏙!' 
      },
      { 
        name: '사용하고 버린 휴지', 
        category: 'trash', 
        emoji: '🧻', 
        graphicId: 'dirty_tissue',
        isTrap: true, 
        trapNotice: '사용한 휴지는 물에 풀어지지 않아 종이가 아니에요! [일반쓰레기]로 버려요!' 
      },
      { 
        name: '깨진 도자기 그릇', 
        category: 'trash', 
        emoji: '🍽️', 
        graphicId: 'broken_ceramic',
        isTrap: true, 
        trapNotice: '사기그릇이나 깨진 유리는 재활용 유리병에 섞이면 안 돼요! [일반쓰레기]예요!' 
      },
      { 
        name: '과자 부스러기 비닐', 
        category: 'trash', 
        emoji: '🍪', 
        graphicId: 'snack_bag',
        isTrap: true, 
        trapNotice: '음식물 기름이나 가루가 묻은 더러운 비닐은 [일반쓰레기]로 버려야 해요!' 
      }
    ];

    // 순차 순환용 덱(Deck) 배열 및 인덱스 관리
    let sequenceQueue = [];
    let currentSequenceIndex = 0;

    function refillSequenceQueue() {
      // 20종 전체 목록을 복사 후 다양한 카테고리가 번갈아 나오도록 균등 셔플
      sequenceQueue = [...ITEMS_POOL];
      for (let i = sequenceQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sequenceQueue[i], sequenceQueue[j]] = [sequenceQueue[j], sequenceQueue[i]];
      }
      currentSequenceIndex = 0;
    }

    // 게임 전체 다시 시작 (점수 및 큐 초기화)
    function restartGame() {
      score = 0;
      scoreDisplay.textContent = score;
      refillSequenceQueue();
      spawnNextItem();
      playSound('success');
      setInstruction('🌱 새로운 분리수거 놀이를 시작합니다! 첫 번째 쓰레기를 분류해 보세요!');
    }

    // 현재 쓰레기 상태
    let currentItem = {
      name: '깨끗한 신문지',
      category: 'paper',
      emoji: '📰',
      graphicId: 'newspaper',
      isTrap: false,
      tip: '신문지는 차곡차곡 종이 통으로!',
      x: 480,
      y: 190,
      radius: 74,
      isHeld: false,
      targetX: 480,
      targetY: 190
    };

    // 포인터 상태 (카메라 손동작 또는 마우스/터치)
    let pointer = {
      x: 480,
      y: 300,
      isGrabbing: false,
      visible: false,
      source: 'none' // 'hand' or 'mouse'
    };

    // ==========================================
    // 3. 쓰레기 생성 및 이동 로직
    // ==========================================
    function spawnNextItem() {
      // 큐가 비었거나 끝까지 도달했으면 새 세트로 순환 충전
      if (sequenceQueue.length === 0 || currentSequenceIndex >= sequenceQueue.length) {
        refillSequenceQueue();
      }

      // 중복 없이 순서대로 1개씩 꺼내기
      const pick = sequenceQueue[currentSequenceIndex];
      const stepNumber = currentSequenceIndex + 1;
      currentSequenceIndex++;

      currentItem = {
        ...pick,
        x: 480,
        y: 190,
        radius: 74,
        isHeld: false,
        targetX: 480,
        targetY: 190
      };
      
      if (currentItem.isTrap) {
        setInstruction(`[${stepNumber}/20] 🚨 조심하세요! "${currentItem.name}" 등장! 어디로 가야 할까요? 🤔`);
      } else {
        setInstruction(`[${stepNumber}/20] 새 친구 "${currentItem.name}" 등장! 어디로 보내줄까요? ✨`);
      }
    }

    function setInstruction(msg) {
      instructionText.textContent = msg;
    }

    // 바구니 투입 검사
    function checkBinDrop() {
      let enteredBin = null;
      BINS.forEach(bin => {
        if (currentItem.x >= bin.x && currentItem.x <= bin.x + bin.w &&
            currentItem.y >= bin.y && currentItem.y <= bin.y + bin.h) {
          enteredBin = bin;
        }
      });

      if (enteredBin) {
        if (enteredBin.id === currentItem.category) {
          // 정답 처리!
          playSound('success');
          score++;
          scoreDisplay.textContent = score;

          if (currentItem.isTrap) {
            setInstruction(`우와! 정답이에요! 💡 "${currentItem.name}"은(는) 오염되어 [일반쓰레기]가 맞아요! 최고! 👏`);
          } else {
            setInstruction(`딩동댕! 🌟 "${currentItem.name}" 분리수거 대성공!`);
          }

          // 해당 쓰레기통 상단에서 화려한 폭죽 발사!
          createBinFireworks(enteredBin);
          spawnNextItem();
        } else {
          // 오답 및 함정 피드백!
          playSound('oops');
          const hintMsg = currentItem.isTrap ? currentItem.trapNotice : `${currentItem.name}은(는) 여기가 아니에요! ${currentItem.tip}`;
          if (currentItem.isTrap) {
            setInstruction(`앗! 속았지요? 😲 ${currentItem.trapNotice}`);
          } else {
            setInstruction(`앗! "${currentItem.name}"은(는) 거기가 아니에요! ${currentItem.tip} 🌱`);
          }
          
          // 팝업 안내창 살짝 띄우기
          showWrongPopup(hintMsg);

          // 중앙 복귀 애니메이션
          currentItem.targetX = 480;
          currentItem.targetY = 190;
        }
      } else {
        // 허공에 놓았을 때 복귀
        currentItem.targetX = 480;
        currentItem.targetY = 190;
      }
    }

    // "다시 생각해보세요" 팝업 표시
    function showWrongPopup(msg) {
      if (wrongPopupTimer) clearTimeout(wrongPopupTimer);
      wrongPopupDesc.textContent = msg;
      wrongPopup.classList.remove('hidden', 'wrong-popup-anim');
      // Reflow 강제 트리거 후 애니메이션 재생
      void wrongPopup.offsetWidth;
      wrongPopup.classList.add('wrong-popup-anim');

      wrongPopupTimer = setTimeout(() => {
        wrongPopup.classList.add('hidden');
        wrongPopup.classList.remove('wrong-popup-anim');
      }, 1800);
    }

    // 쓰레기통 폭죽 & 색종이 효과
    function createBinFireworks(bin) {
      const container = canvas.parentElement;
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width / canvas.width;
      const scaleY = rect.height / canvas.height;

      // 쓰레기통 뚜껑 중심 좌표 계산
      const originX = (bin.x + bin.w / 2) * scaleX;
      const originY = (bin.y + 10) * scaleY;

      const confettiColors = ['#FF1744', '#FFEA00', '#00E676', '#00B0FF', '#D500F9', '#FF9100'];
      const symbols = ['⭐', '✨', '🎉', '🎊', '💫', '🎈'];

      // 1. 별 & 이모지 폭죽 (12개)
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'pop-star';
        p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.left = `${originX}px`;
        p.style.top = `${originY}px`;

        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5; // 위쪽 부채꼴 방향
        const dist = 70 + Math.random() * 110;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

        container.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }

      // 2. 사각 색종이 폭죽 조각 (18개)
      for (let i = 0; i < 18; i++) {
        const piece = document.createElement('div');
        piece.style.position = 'absolute';
        piece.style.pointerEvents = 'none';
        piece.style.zIndex = '45';
        piece.style.left = `${originX}px`;
        piece.style.top = `${originY}px`;
        piece.style.width = `${6 + Math.random() * 8}px`;
        piece.style.height = `${8 + Math.random() * 12}px`;
        piece.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        piece.style.borderRadius = '3px';
        piece.style.transform = 'translate(-50%, -50%)';

        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
        const velocity = 80 + Math.random() * 120;
        const targetX = Math.cos(angle) * velocity;
        const targetY = Math.sin(angle) * velocity + 20;

        piece.animate([
          { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1 },
          { transform: `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(0.6) rotate(${Math.random() * 720}deg)`, opacity: 0 }
        ], {
          duration: 750 + Math.random() * 300,
          easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
        }).onfinish = () => piece.remove();

        container.appendChild(piece);
      }
    }

    // ==========================================
    // 4. MediaPipe Hands 카메라 연동
    // ==========================================
    async function startCamera() {
      try {
        camGuideOverlay.style.opacity = '0';
        setTimeout(() => camGuideOverlay.classList.add('hidden'), 300);

        modeBadge.textContent = "웹캠 인식 중 🖐️ (화면에 손을 보여주세요!)";
        modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        document.getElementById('cam-btn-text').textContent = "카메라 끄기";

        handsInstance = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        handsInstance.setOptions({
          maxNumHands: 1, // 유아 1명 집중 모드
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });

        handsInstance.onResults(onHandResults);

        cameraInstance = new Camera(video, {
          onFrame: async () => {
            if (cameraActive) {
              await handsInstance.send({ image: video });
            }
          },
          width: 960,
          height: 600
        });

        await cameraInstance.start();
        cameraActive = true;
      } catch (err) {
        console.warn("카메라 접근 불가 또는 거부됨:", err);
        modeBadge.textContent = "마우스 / 화면 터치 모드로 동작 중입니다 😊";
        modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-sky-500";
        camGuideOverlay.classList.add('hidden');
      }
    }

    function stopCamera() {
      if (cameraInstance) {
        cameraInstance.stop();
        cameraInstance = null;
      }
      cameraActive = false;
      document.getElementById('cam-btn-text').textContent = "카메라 켜기";
      modeBadge.textContent = "마우스 / 화면 터치 모드";
      modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-sky-500";
    }

    // MediaPipe 결과 처리 (거울 반전 & 엄지-검지 핀치 감지)
    function onHandResults(results) {
      if (!cameraActive) return;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        // 거울 모드 (x축 반전: 1 - x)
        pointer.x = (1 - indexTip.x) * canvas.width;
        pointer.y = indexTip.y * canvas.height;
        pointer.visible = true;
        pointer.source = 'hand';

        // 엄지와 검지 사이 거리 계산
        const dx = (thumbTip.x - indexTip.x) * canvas.width;
        const dy = (thumbTip.y - indexTip.y) * canvas.height;
        const pinchDistance = Math.hypot(dx, dy);

        // 간격 65px 미만이면 주먹/집기 상태
        const previouslyGrabbing = pointer.isGrabbing;
        pointer.isGrabbing = pinchDistance < 65;

        handlePointerGrab(previouslyGrabbing);
      } else {
        // 손이 화면 밖으로 나감
        if (pointer.source === 'hand') {
          if (currentItem.isHeld) {
            currentItem.isHeld = false;
            checkBinDrop();
          }
          pointer.visible = false;
        }
      }
    }

    // 잡기 / 놓기 공통 처리
    function handlePointerGrab(previouslyGrabbing) {
      const distToItem = Math.hypot(pointer.x - currentItem.x, pointer.y - currentItem.y);

      // 1. 물건 잡기
      if (!previouslyGrabbing && pointer.isGrabbing) {
        if (distToItem < currentItem.radius + 35) {
          currentItem.isHeld = true;
          playSound('grab');
          setInstruction(`"${currentItem.name}" 꽉 쥐었어요! 알맞은 바구니로 가볼까요?`);
        }
      }

      // 2. 쥐고 있는 동안 추적
      if (currentItem.isHeld && pointer.isGrabbing) {
        currentItem.x += (pointer.x - currentItem.x) * 0.45;
        currentItem.y += (pointer.y - currentItem.y) * 0.45;
      }

      // 3. 손을 폈을 때 (놓기)
      if (previouslyGrabbing && !pointer.isGrabbing && currentItem.isHeld) {
        currentItem.isHeld = false;
        checkBinDrop();
      }
    }

    // ==========================================
    // 5. 마우스 및 스마트보드 터치 폴백
    // ==========================================
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function onPointerDown(e) {
      const pos = getCanvasCoords(e);
      pointer.x = pos.x;
      pointer.y = pos.y;
      pointer.visible = true;
      pointer.source = 'mouse';
      const prev = pointer.isGrabbing;
      pointer.isGrabbing = true;
      handlePointerGrab(prev);
    }

    function onPointerMove(e) {
      if (pointer.source === 'hand') return; // 카메라가 제어 중일 때는 마우스 무시
      const pos = getCanvasCoords(e);
      pointer.x = pos.x;
      pointer.y = pos.y;
      pointer.visible = true;
      if (currentItem.isHeld) {
        currentItem.x = pos.x;
        currentItem.y = pos.y;
      }
    }

    function onPointerUp(e) {
      if (pointer.source === 'hand') return;
      const prev = pointer.isGrabbing;
      pointer.isGrabbing = false;
      handlePointerGrab(prev);
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (currentItem.isHeld) e.preventDefault(); onPointerMove(e); }, { passive: false });
    window.addEventListener('touchend', (e) => { onPointerUp(e); });

    // ==========================================
    // 6. 메인 애니메이션 렌더링 루프
    // ==========================================
    function renderLoop() {
      // (A) 비디오 배경 or 가상 배경 그리기
      if (cameraActive && video.readyState >= 2) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1); // 거울 모드 반전
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 유아 사물 인지 향상을 위한 밝고 부드러운 화이트 틴트
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      } else {
        // 카메라 미사용 시 은은한 교실 잔디밭 그라데이션
        const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, '#E8F5E9');
        bgGrad.addColorStop(0.7, '#C8E6C9');
        bgGrad.addColorStop(1, '#A5D6A7');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 칠판 가이드 선
        ctx.strokeStyle = 'rgba(46, 125, 50, 0.15)';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]);
        ctx.strokeRect(20, 20, canvas.width - 40, 360);
        ctx.setLineDash([]);
      }

      // (B) 하단 분리수거 쓰레기통 6개 렌더링 (리얼한 쓰레기통 디자인)
      BINS.forEach(bin => {
        // 호버/접근 하이라이트
        const isHovered = currentItem.isHeld &&
          currentItem.x >= bin.x && currentItem.x <= bin.x + bin.w &&
          currentItem.y >= bin.y && currentItem.y <= bin.y + bin.h;

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 6;

        const bodyX = bin.x + 8;
        const bodyY = bin.y + 24;
        const bodyW = bin.w - 16;
        const bodyH = bin.h - 24;

        // 1. 쓰레기통 본체 (아래로 살짝 좁아지는 원통 사다리꼴)
        ctx.fillStyle = isHovered ? bin.lightColor : bin.color;
        ctx.beginPath();
        ctx.moveTo(bodyX, bodyY);
        ctx.lineTo(bodyX + bodyW, bodyY);
        ctx.lineTo(bodyX + bodyW - 8, bodyY + bodyH - 10);
        ctx.quadraticCurveTo(bodyX + bodyW / 2, bodyY + bodyH, bodyX + 8, bodyY + bodyH - 10);
        ctx.closePath();
        ctx.fill();

        // 본체 테두리
        ctx.lineWidth = isHovered ? 5 : 3.5;
        ctx.strokeStyle = isHovered ? '#FFD54F' : '#FFFFFF';
        ctx.stroke();

        // 2. 입체감을 주는 본체 세로 리브(주름선 2개)
        ctx.strokeStyle = isHovered ? 'rgba(0,0,0,0.1)' : bin.darkColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(bodyX + bodyW * 0.33, bodyY + 12);
        ctx.lineTo(bodyX + bodyW * 0.35, bodyY + bodyH - 18);
        ctx.moveTo(bodyX + bodyW * 0.67, bodyY + 12);
        ctx.lineTo(bodyX + bodyW * 0.65, bodyY + bodyH - 18);
        ctx.stroke();

        // 3. 쓰레기통 뚜껑 림(Lip)
        ctx.fillStyle = isHovered ? '#FFF59D' : bin.darkColor;
        ctx.beginPath();
        ctx.roundRect(bin.x, bin.y + 8, bin.w, 16, 8);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        // 4. 뚜껑 상단 손잡이 (반원 링)
        ctx.fillStyle = bin.darkColor;
        ctx.beginPath();
        ctx.roundRect(bin.x + bin.w / 2 - 18, bin.y, 36, 10, 5);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        ctx.restore();

        // 5. 쓰레기통 이모지 및 라벨 텍스트 (글씨 및 아이콘 크기 대폭 확대)
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '40px sans-serif';
        ctx.fillText(bin.icon, bin.x + bin.w / 2, bodyY + 40);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 23px "Jua", sans-serif';
        ctx.fillText(bin.name, bin.x + bin.w / 2, bodyY + 86);

        if (isHovered) {
          ctx.font = 'bold 15px "Jua", sans-serif';
          ctx.fillStyle = '#1B5E20';
          ctx.fillText('손 펴기! 🖐️', bin.x + bin.w / 2, bodyY + 114);
        }
      });

      // (C) 쓰레기 아이템 애니메이션 & 렌더링
      if (!currentItem.isHeld) {
        // 부드럽게 제자리로 이동
        currentItem.x += (currentItem.targetX - currentItem.x) * 0.12;
        currentItem.y += (currentItem.targetY - currentItem.y) * 0.12;
      }

      ctx.save();
      // 그림자
      ctx.shadowColor = 'rgba(0,0,0,0.22)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 10;
      
      // 함정 아이템은 약간 주황/붉은 기운 테두리 살짝 가미
      ctx.fillStyle = currentItem.isHeld ? '#FFFDE7' : '#FFFFFF';
      ctx.beginPath();
      ctx.arc(currentItem.x, currentItem.y, currentItem.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = currentItem.isHeld ? 8 : 5;
      ctx.strokeStyle = currentItem.isHeld ? '#F59E0B' : (currentItem.isTrap ? '#FF7043' : '#CBD5E1');
      ctx.stroke();
      ctx.restore();

      // [실물 그래픽 렌더링]: 이모지 대신 실물 느낌의 캔버스 일러스트 드로잉
      drawRealisticItem(ctx, currentItem.x, currentItem.y - 12, currentItem.graphicId, currentItem.emoji);

      // 이름표 텍스트 배경 캡슐 알약 (유아 시인성 대폭 강화: 22px -> 28px 확대 및 여백 확장)
      ctx.save();
      ctx.font = 'bold 28px "Jua", sans-serif';
      const textWidth = ctx.measureText(currentItem.name).width;
      const tagW = textWidth + 34;
      const tagH = 44;
      const tagX = currentItem.x - tagW / 2;
      const tagY = currentItem.y + 40;

      ctx.fillStyle = currentItem.isTrap ? '#FFEBEE' : '#F8FAFC';
      ctx.strokeStyle = currentItem.isTrap ? '#E53935' : '#475569';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(tagX, tagY, tagW, tagH, 22);
      ctx.fill();
      ctx.stroke();

      // 이름표 글씨 (크고 선명하게 28px)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = currentItem.isTrap ? '#B71C1C' : '#0F172A';
      ctx.fillText(currentItem.name, currentItem.x, tagY + tagH / 2 + 1);
      ctx.restore();

      // (D) 손가락 포인터 (마법봉 별 커서)
      if (pointer.visible) {
        ctx.save();
        ctx.shadowColor = pointer.isGrabbing ? 'rgba(239, 68, 68, 0.4)' : 'rgba(245, 158, 11, 0.4)';
        ctx.shadowBlur = 15;

        // 원형 후광
        ctx.fillStyle = pointer.isGrabbing ? 'rgba(239, 68, 68, 0.85)' : 'rgba(251, 191, 36, 0.85)';
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, pointer.isGrabbing ? 20 : 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        // 손가락 중심 심볼
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pointer.isGrabbing ? '✊' : '🖐️', pointer.x, pointer.y);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    // ==========================================
    // 6-1. 실물 모습을 닮은 벡터 일러스트레이터
    // ==========================================
    function drawRealisticItem(ctx, cx, cy, id, fallbackEmoji) {
      ctx.save();
      ctx.translate(cx, cy);

      switch(id) {
        case 'pet_bottle': // 투명 페트병 (생수병)
          // 병 본체 (투명 하늘빛)
          ctx.fillStyle = '#E1F5FE';
          ctx.strokeStyle = '#29B6F6';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-22, -34, 44, 76, [8, 8, 14, 14]);
          ctx.fill();
          ctx.stroke();
          // 병 목 & 파란 뚜껑
          ctx.fillStyle = '#0288D1';
          ctx.fillRect(-10, -45, 20, 11);
          ctx.fillStyle = '#B3E5FC';
          ctx.fillRect(-12, -37, 24, 4);
          // 맑은 물 채움 & 굴절 하이라이트
          ctx.fillStyle = 'rgba(79, 195, 247, 0.45)';
          ctx.beginPath();
          ctx.roundRect(-19, -5, 38, 44, [0, 0, 11, 11]);
          ctx.fill();
          // 물결 무늬 주름선
          ctx.strokeStyle = '#81D4FA';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-16, 5); ctx.lineTo(16, 5);
          ctx.moveTo(-16, 18); ctx.lineTo(16, 18);
          ctx.stroke();
          break;

        case 'spicy_box': // 떡볶이 양념 밴 배달 플라스틱 용기 (함정)
          // 찌개/떡볶이 배달 하얀 플라스틱 용기
          ctx.fillStyle = '#FFF8E1';
          ctx.strokeStyle = '#FFA726';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-36, -26, 72, 54, 10);
          ctx.fill();
          ctx.stroke();
          // 뚜껑 패킹 날개
          ctx.fillStyle = '#FFE082';
          ctx.fillRect(-40, -29, 80, 7);
          // 내부에 붉게 착색된 떡볶이 고추기름 얼룩
          ctx.fillStyle = '#E53935';
          ctx.beginPath();
          ctx.ellipse(-8, -4, 22, 14, 0.2, 0, Math.PI * 2);
          ctx.ellipse(14, 6, 14, 10, -0.1, 0, Math.PI * 2);
          ctx.fill();
          // 국물 기름 튄 자국
          ctx.fillStyle = '#C62828';
          ctx.beginPath();
          ctx.arc(-22, 12, 4, 0, Math.PI * 2);
          ctx.arc(24, -12, 3.5, 0, Math.PI * 2);
          ctx.arc(6, -14, 3, 0, Math.PI * 2);
          ctx.fill();
          // 주의 텍스트 뱃지
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText('양념오염', 0, 1);
          break;

        case 'pizza_box': // 기름 묻은 피자박스 (함정)
          // 골판지 피자 사각 박스
          ctx.fillStyle = '#D7CCC8';
          ctx.strokeStyle = '#8D6E63';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.roundRect(-38, -30, 76, 60, 6);
          ctx.fill();
          ctx.stroke();
          // 빨간 피자 로고 원
          ctx.fillStyle = '#E53935';
          ctx.beginPath();
          ctx.arc(0, -6, 18, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#FFEB3B';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText('PIZZA', 0, -5);
          // 진하게 스며든 노란 치즈 기름 얼룩
          ctx.fillStyle = 'rgba(255, 179, 0, 0.7)';
          ctx.beginPath();
          ctx.ellipse(-16, 12, 16, 9, -0.2, 0, Math.PI*2);
          ctx.ellipse(18, 14, 14, 8, 0.3, 0, Math.PI*2);
          ctx.fill();
          break;

        case 'box': // 택배 종이 상자
          ctx.fillStyle = '#C7A27C';
          ctx.strokeStyle = '#8D6E63';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-35, -28, 70, 56, 6);
          ctx.fill();
          ctx.stroke();
          // 상단 갈색 박스테이프
          ctx.fillStyle = '#BCAAA4';
          ctx.fillRect(-7, -28, 14, 56);
          // 배송 송장 스티커
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(10, -18, 18, 22);
          ctx.fillStyle = '#424242';
          ctx.fillRect(12, -14, 14, 2);
          ctx.fillRect(12, -9, 10, 2);
          break;

        case 'milk': // 우유팩
          // 삼각형 지붕
          ctx.fillStyle = '#E0F2FE';
          ctx.strokeStyle = '#0288D1';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, -42); ctx.lineTo(-24, -18); ctx.lineTo(24, -18); ctx.closePath();
          ctx.fill(); ctx.stroke();
          // 몸통
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(-24, -18, 48, 56);
          ctx.strokeRect(-24, -18, 48, 56);
          // 파란 우유 무늬 웨이브
          ctx.fillStyle = '#38BDF8';
          ctx.beginPath();
          ctx.arc(0, 10, 16, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('우유', 0, 14);
          break;

        case 'soda_can': // 탄산음료 캔
          // 금속 은회색 몸체
          ctx.fillStyle = '#EF4444';
          ctx.strokeStyle = '#94A3B8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-22, -32, 44, 66, 8);
          ctx.fill(); ctx.stroke();
          // 은색 캔 뚜껑 & 림
          ctx.fillStyle = '#CBD5E1';
          ctx.beginPath();
          ctx.ellipse(0, -32, 22, 6, 0, 0, Math.PI*2);
          ctx.fill(); ctx.stroke();
          // 캔 뚜껑 오프너 고리
          ctx.fillStyle = '#64748B';
          ctx.beginPath();
          ctx.arc(0, -32, 4, 0, Math.PI*2);
          ctx.fill();
          // 캔 찌그러짐 표현 라인
          ctx.strokeStyle = '#B91C1C';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-18, -4); ctx.lineTo(-4, 4); ctx.lineTo(16, -2);
          ctx.stroke();
          break;

        case 'juice_bottle': // 주스 유리병
          // 투명 초록 유리병
          ctx.fillStyle = 'rgba(74, 222, 128, 0.45)';
          ctx.strokeStyle = '#15803D';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-20, -18, 40, 58, [6, 6, 12, 12]);
          ctx.fill(); ctx.stroke();
          // 병목
          ctx.fillStyle = 'rgba(74, 222, 128, 0.6)';
          ctx.fillRect(-8, -38, 16, 20);
          ctx.strokeRect(-8, -38, 16, 20);
          // 황금색 금속 뚜껑
          ctx.fillStyle = '#F59E0B';
          ctx.fillRect(-10, -42, 20, 7);
          // 오렌지 주스 라벨
          ctx.fillStyle = '#FB923C';
          ctx.fillRect(-16, -2, 32, 24);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText('JUICE', 0, 13);
          break;

        case 'dirty_tissue': // 사용한 콧물 휴지 (함정)
          ctx.fillStyle = '#F1F5F9';
          ctx.strokeStyle = '#94A3B8';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          // 구겨진 종이 뭉치 곡선
          ctx.moveTo(-24, -14);
          ctx.bezierCurveTo(-35, 10, -10, 32, 12, 24);
          ctx.bezierCurveTo(34, 18, 30, -15, 8, -25);
          ctx.bezierCurveTo(-10, -32, -20, -22, -24, -14);
          ctx.fill(); ctx.stroke();
          // 더러운 얼룩 (연두/누런 콧물 얼룩)
          ctx.fillStyle = '#A3E635';
          ctx.beginPath();
          ctx.ellipse(-2, 2, 9, 6, 0.4, 0, Math.PI*2);
          ctx.fill();
          break;

        case 'broken_ceramic': // 깨진 도자기 그릇 (함정)
          ctx.fillStyle = '#F8FAFC';
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 3;
          // 깨진 파편 조각 1
          ctx.beginPath();
          ctx.moveTo(-32, -10); ctx.lineTo(4, -30); ctx.lineTo(-4, 18); ctx.closePath();
          ctx.fill(); ctx.stroke();
          // 깨진 파편 조각 2
          ctx.beginPath();
          ctx.moveTo(12, -26); ctx.lineTo(34, -2); ctx.lineTo(16, 24); ctx.lineTo(2, 6); ctx.closePath();
          ctx.fill(); ctx.stroke();
          // 푸른 도자기 문양
          ctx.strokeStyle = '#1D4ED8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(-16, -4, 8, 0, Math.PI);
          ctx.stroke();
          break;

        case 'plastic_bag': // 비닐봉지
          ctx.fillStyle = 'rgba(216, 180, 254, 0.65)';
          ctx.strokeStyle = '#9333EA';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.moveTo(-28, 26);
          ctx.lineTo(-28, -8);
          ctx.quadraticCurveTo(-28, -34, -16, -34);
          ctx.lineTo(-12, -10);
          ctx.lineTo(12, -10);
          ctx.lineTo(16, -34);
          ctx.quadraticCurveTo(28, -34, 28, -8);
          ctx.lineTo(28, 26);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // 가운데 주름
          ctx.strokeStyle = '#C084FC';
          ctx.beginPath();
          ctx.moveTo(-8, 0); ctx.lineTo(-4, 20);
          ctx.moveTo(8, 2); ctx.lineTo(6, 22);
          ctx.stroke();
          break;

        case 'newspaper': // 깨끗한 신문지
          ctx.fillStyle = '#F8FAFC';
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-34, -26, 68, 52, 4);
          ctx.fill(); ctx.stroke();
          // 신문 접힘 선
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, -26); ctx.lineTo(0, 26);
          ctx.stroke();
          // 신문 기사 텍스트 줄
          ctx.fillStyle = '#94A3B8';
          ctx.fillRect(-28, -18, 22, 5);
          ctx.fillRect(-28, -8, 22, 2.5);
          ctx.fillRect(-28, -2, 22, 2.5);
          ctx.fillRect(-28, 4, 18, 2.5);
          ctx.fillRect(6, -18, 22, 10);
          ctx.fillRect(6, -4, 22, 2.5);
          ctx.fillRect(6, 2, 22, 2.5);
          break;

        case 'yogurt': // 요구르트병
          ctx.fillStyle = '#FFE0B2';
          ctx.strokeStyle = '#FB8C00';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-18, -14, 36, 44, [4, 4, 12, 12]);
          ctx.fill(); ctx.stroke();
          // 좁은 병목
          ctx.fillStyle = '#FFE0B2';
          ctx.fillRect(-12, -28, 24, 14);
          ctx.strokeRect(-12, -28, 24, 14);
          // 알루미늄 뚜껑 호일
          ctx.fillStyle = '#E53935';
          ctx.fillRect(-14, -32, 28, 6);
          // 주황 띠 라벨
          ctx.fillStyle = '#FF9800';
          ctx.fillRect(-16, 0, 32, 14);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 9px sans-serif';
          ctx.fillText('요구르트', 0, 9);
          break;

        case 'shampoo': // 샴푸통
          ctx.fillStyle = '#E0F7FA';
          ctx.strokeStyle = '#00ACC1';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-22, -20, 44, 56, 12);
          ctx.fill(); ctx.stroke();
          // 펌프 목
          ctx.fillStyle = '#B2EBF2';
          ctx.fillRect(-6, -32, 12, 12);
          // 펌프 머리 노즐
          ctx.fillStyle = '#00838F';
          ctx.beginPath();
          ctx.roundRect(-16, -38, 26, 8, 4);
          ctx.fill();
          // 거품 방울 일러스트
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.beginPath();
          ctx.arc(-6, 2, 6, 0, Math.PI*2);
          ctx.arc(8, 12, 4, 0, Math.PI*2);
          ctx.fill();
          break;

        case 'tuna_can': // 참치캔
          ctx.fillStyle = '#ECEFF1';
          ctx.strokeStyle = '#78909C';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-28, -12, 56, 36, 8);
          ctx.fill(); ctx.stroke();
          // 윗면 은색 테두리
          ctx.fillStyle = '#CFD8DC';
          ctx.beginPath();
          ctx.ellipse(0, -12, 28, 8, 0, 0, Math.PI*2);
          ctx.fill(); ctx.stroke();
          // 참치 라벨 (파랑/노랑)
          ctx.fillStyle = '#1E88E5';
          ctx.fillRect(-26, -2, 52, 18);
          ctx.fillStyle = '#FFEB3B';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText('참치', 0, 11);
          break;

        case 'food_can': // 옥수수 통조림 캔
          ctx.fillStyle = '#FFF9C4';
          ctx.strokeStyle = '#FBC02D';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-22, -26, 44, 58, 6);
          ctx.fill(); ctx.stroke();
          // 상단/하단 은색 림
          ctx.fillStyle = '#CFD8DC';
          ctx.beginPath();
          ctx.ellipse(0, -26, 22, 6, 0, 0, Math.PI*2);
          ctx.fill(); ctx.stroke();
          // 노란 옥수수 알맹이 무늬
          ctx.fillStyle = '#F57F17';
          ctx.beginPath();
          ctx.arc(-8, 4, 4, 0, Math.PI*2);
          ctx.arc(4, 4, 4, 0, Math.PI*2);
          ctx.arc(-2, 12, 4, 0, Math.PI*2);
          ctx.fill();
          break;

        case 'jam_jar': // 딸기 잼 유리병
          ctx.fillStyle = 'rgba(255, 235, 238, 0.6)';
          ctx.strokeStyle = '#E57373';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-24, -18, 48, 50, 10);
          ctx.fill(); ctx.stroke();
          // 빨간 딸기잼 내용물
          ctx.fillStyle = '#E53935';
          ctx.beginPath();
          ctx.roundRect(-20, -6, 40, 34, [0, 0, 8, 8]);
          ctx.fill();
          // 체크무늬 뚜껑
          ctx.fillStyle = '#D32F2F';
          ctx.beginPath();
          ctx.roundRect(-22, -28, 44, 12, 4);
          ctx.fill();
          break;

        case 'baby_food': // 이유식 유리병
          ctx.fillStyle = 'rgba(238, 242, 246, 0.7)';
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-20, -14, 40, 42, 8);
          ctx.fill(); ctx.stroke();
          // 노란 당근/단호박 죽 내용물
          ctx.fillStyle = '#FFA726';
          ctx.beginPath();
          ctx.roundRect(-16, -2, 32, 26, [0, 0, 6, 6]);
          ctx.fill();
          // 하늘색 뚜껑
          ctx.fillStyle = '#4FC3F7';
          ctx.beginPath();
          ctx.roundRect(-18, -22, 36, 10, 4);
          ctx.fill();
          break;

        case 'bubble_wrap': // 뽁뽁이 완충재
          ctx.fillStyle = 'rgba(224, 242, 254, 0.55)';
          ctx.strokeStyle = '#38BDF8';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(-30, -26, 60, 52, 6);
          ctx.fill(); ctx.stroke();
          // 올록볼록 동그란 공기 방울들
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.strokeStyle = '#0288D1';
          ctx.lineWidth = 1.5;
          const bubbles = [
            [-18, -14], [0, -14], [18, -14],
            [-9, 0], [9, 0],
            [-18, 14], [0, 14], [18, 14]
          ];
          bubbles.forEach(([bx, by]) => {
            ctx.beginPath();
            ctx.arc(bx, by, 6.5, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();
          });
          break;

        case 'bread_bag': // 빵 포장 비닐
          ctx.fillStyle = 'rgba(255, 248, 225, 0.65)';
          ctx.strokeStyle = '#FFB300';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(-26, -22, 52, 54, 8);
          ctx.fill(); ctx.stroke();
          // 금색 빵철사(클립)
          ctx.fillStyle = '#F57F17';
          ctx.beginPath();
          ctx.roundRect(-8, -30, 16, 9, 3);
          ctx.fill();
          // 안에 비치는 갈색 식빵
          ctx.fillStyle = '#D7CCC8';
          ctx.beginPath();
          ctx.roundRect(-16, -10, 32, 34, 6);
          ctx.fill();
          break;

        case 'snack_bag': // 과자 부스러기 비닐 (함정)
          ctx.fillStyle = '#FF7043';
          ctx.strokeStyle = '#D84315';
          ctx.lineWidth = 3;
          ctx.beginPath();
          // 뜯겨진 지그재그 모양의 과자 봉지
          ctx.moveTo(-28, -20);
          ctx.lineTo(-14, -26); ctx.lineTo(0, -20); ctx.lineTo(14, -26); ctx.lineTo(28, -20);
          ctx.lineTo(24, 26); ctx.lineTo(-24, 26);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // 과자 부스러기 및 기름 가루 얼룩
          ctx.fillStyle = '#FFD54F';
          ctx.beginPath();
          ctx.arc(-8, 2, 4, 0, Math.PI*2);
          ctx.arc(8, 8, 3.5, 0, Math.PI*2);
          ctx.arc(-4, 14, 3, 0, Math.PI*2);
          ctx.fill();
          // 오염 경고 텍스트
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText('기름/가루', 0, -4);
          break;

        default: // 기타 기본 아이템 (고해상도 이모지 폴백)
          ctx.font = '76px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(fallbackEmoji, 0, 0);
          break;
      }

      ctx.restore();
    }

    // ==========================================
    // 7. 컨트롤 버튼 이벤트
    // ==========================================
    document.getElementById('activate-cam-btn').addEventListener('click', () => {
      initAudio();
      startCamera();
    });

    document.getElementById('use-mouse-btn').addEventListener('click', () => {
      initAudio();
      camGuideOverlay.style.opacity = '0';
      setTimeout(() => camGuideOverlay.classList.add('hidden'), 300);
      modeBadge.textContent = "마우스 / 스마트보드 터치 모드 🖱️";
      modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-sky-500";
    });

    document.getElementById('camera-toggle-btn').addEventListener('click', () => {
      initAudio();
      if (cameraActive) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    document.getElementById('sound-btn').addEventListener('click', () => {
      isSoundOn = !isSoundOn;
      document.getElementById('sound-icon').textContent = isSoundOn ? '🔔' : '🔕';
      if (isSoundOn) playSound('grab');
    });

    // 다시 시작(새로고침) 버튼 클릭 이벤트
    document.getElementById('reset-game-btn').addEventListener('click', () => {
      initAudio();
      restartGame();
    });

    // 시작
    window.onload = () => {
      spawnNextItem();
      renderLoop();
    };
  </script>
</body>
</html>
