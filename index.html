<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>알록달록 색깔 공 분류 연습</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Jua & Noto Sans KR 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@600;800&display=swap" rel="stylesheet">
  <!-- Google MediaPipe Hands CDN (안정화 버전) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 별 폭죽 애니메이션 */
    @keyframes popSpread {
      0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(220deg); opacity: 0; }
    }
    .pop-particle {
      position: absolute;
      pointer-events: none;
      animation: popSpread 0.75s ease-out forwards;
      z-index: 50;
      font-size: 32px;
    }

    /* 다시 생각 팝업 */
    @keyframes bounceToast {
      0% { transform: translate(-50%, -40%) scale(0.8); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
      35% { transform: translate(-50%, -50%) scale(0.96); }
      50% { transform: translate(-50%, -50%) scale(1); }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
    }
    .toast-anim {
      animation: bounceToast 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-100 via-indigo-50 to-pink-50 min-h-screen text-slate-800 flex flex-col justify-between p-2 sm:p-4">

  <!-- 상단 상태바 -->
  <header class="w-full max-w-4xl mx-auto flex items-center justify-between bg-white/95 backdrop-blur-md rounded-3xl px-4 py-3 shadow-md border-4 border-indigo-300">
    <div class="flex items-center gap-2 sm:gap-3">
      <span class="text-3xl sm:text-4xl">🎈</span>
      <div>
        <h1 class="text-xl sm:text-2xl text-indigo-900 font-extrabold tracking-wide">색깔 공 쏙쏙! 손동작 연습</h1>
        <p id="mode-badge" class="text-xs sm:text-sm text-indigo-600 font-sans font-bold flex items-center gap-1.5">
          <span id="mode-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="mode-text">카메라 준비 중 (마우스/터치로도 가능해요!)</span>
        </p>
      </div>
    </div>

    <!-- 점수판 및 컨트롤 버튼 -->
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-1.5 bg-amber-100 px-3 py-1.5 rounded-2xl border-2 border-amber-300 shadow-inner">
        <span class="text-2xl">⭐</span>
        <span id="score-display" class="text-xl sm:text-2xl text-amber-900 font-bold">0</span>
      </div>
      <button id="reset-btn" title="처음부터 다시 연습해요!" class="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 rounded-2xl border-2 border-indigo-300 text-sm font-bold flex items-center gap-1 transition-all active:scale-95 shadow-sm">
        <span class="text-lg">🔄</span>
        <span class="hidden sm:inline">다시 시작</span>
      </button>
      <button id="cam-toggle-btn" class="px-3 py-1.5 bg-sky-100 hover:bg-sky-200 text-sky-900 rounded-2xl border-2 border-sky-300 text-sm font-bold flex items-center gap-1 transition-all active:scale-95">
        <span class="text-lg">📷</span>
        <span class="hidden sm:inline" id="cam-btn-text">카메라 켜기</span>
      </button>
      <button id="sound-btn" class="p-2 sm:px-3 sm:py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-2xl border-2 border-rose-300 text-sm font-bold flex items-center gap-1 transition-all active:scale-95">
        <span id="sound-icon" class="text-lg">🔔</span>
      </button>
    </div>
  </header>

  <!-- 메인 게임 영역 -->
  <main class="w-full max-w-4xl mx-auto my-auto flex flex-col items-center justify-center flex-grow py-2">
    
    <!-- 유아용 직관 안내 배너 -->
    <div id="instruction-pill" class="mb-2 px-6 py-2.5 rounded-full bg-white border-4 border-indigo-400 shadow-md text-lg sm:text-2xl text-indigo-950 font-extrabold flex items-center gap-2.5 transition-all text-center">
      <span class="text-3xl animate-bounce">🖐️</span>
      <span id="instruction-text">카메라 앞에서 주먹을 쥐어 공을 잡고, 같은 색 바구니에서 손을 펴보세요!</span>
    </div>

    <!-- 캔버스 컨테이너 (960x600) -->
    <div class="relative w-full max-w-4xl aspect-[16/10] bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 sm:border-8 border-white">
      <video id="webcam-video" playsinline autoplay muted class="hidden"></video>
      <canvas id="game-canvas" width="960" height="600" class="w-full h-full block cursor-pointer"></canvas>

      <!-- 다시 생각 팝업 레이어 -->
      <div id="wrong-popup" class="hidden absolute top-1/2 left-1/2 pointer-events-none z-40 w-11/12 max-w-sm bg-white/95 backdrop-blur-md rounded-3xl border-4 border-amber-400 p-5 shadow-2xl text-center">
        <div class="text-5xl mb-2 animate-bounce">🤔💡</div>
        <h3 class="text-2xl font-extrabold text-amber-950 mb-1">다시 한 번 살펴볼까요?</h3>
        <p id="wrong-popup-desc" class="text-base font-sans font-bold text-slate-700 leading-snug">
          공과 같은 색깔의 바구니에 넣어주세요!
        </p>
      </div>

      <!-- 카메라 시작 가이드 오버레이 -->
      <div id="cam-guide-overlay" class="absolute inset-0 bg-slate-900/65 backdrop-blur-sm flex flex-col items-center justify-center text-white p-6 text-center transition-opacity duration-300">
        <div class="text-6xl mb-3 animate-pulse">🔴🟡🔵</div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-300 mb-2">색깔 공 넣기 연습 모드!</h2>
        <p class="text-base sm:text-lg text-slate-100 max-w-md font-sans mb-5 leading-relaxed">
          카메라를 켜고 <b>손을 오므려(주먹)</b> 공을 쥔 다음,<br>
          알맞은 통 위로 옮겨서 <b>손을 쫙 펴보세요!</b>
        </p>
        <div class="flex flex-wrap gap-3 justify-center">
          <button id="activate-cam-btn" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-transform flex items-center gap-2">
            <span>📷 카메라 켜고 연습하기</span>
          </button>
          <button id="use-mouse-btn" class="px-6 py-3 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-bold text-lg backdrop-blur-md active:scale-95 transition-transform">
            <span>🖱️ 마우스/터치로 먼저 해보기</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 교실 가이드 풋터 -->
  <footer class="w-full max-w-4xl mx-auto text-center py-1">
    <p class="text-xs sm:text-sm text-indigo-900/80 font-sans font-bold">
      💡 카메라 앞에서 1.5m 정도 떨어져 손바닥 전체가 보이도록 서면 인식이 가장 잘 됩니다.
    </p>
  </footer>

  <script>
    // ==========================================
    // 1. Web Audio 사운드 효과음 시스템
    // ==========================================
    let audioCtx = null;
    let isSoundOn = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!isSoundOn) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'grab') {
          // 뽁! 잡는 소리
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'success') {
          // 도-미-솔-도 실로폰 성공음
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + i * 0.07);
            g.gain.setValueAtTime(0.25, now + i * 0.07);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.3);
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start(now + i * 0.07);
            o.stop(now + i * 0.07 + 0.3);
          });
        } else if (type === 'oops') {
          // 통~통 갸우뚱 소리
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.22);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {
        console.warn(e);
      }
    }

    // ==========================================
    // 2. DOM 요소 및 기본 상태 변수
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam-video');
    const instructionText = document.getElementById('instruction-text');
    const modeBadge = document.getElementById('mode-text');
    const modeDot = document.getElementById('mode-dot');
    const scoreDisplay = document.getElementById('score-display');
    const camGuideOverlay = document.getElementById('cam-guide-overlay');
    const wrongPopup = document.getElementById('wrong-popup');
    const wrongPopupDesc = document.getElementById('wrong-popup-desc');
    let wrongPopupTimer = null;

    let score = 0;
    let cameraActive = false;
    let handsInstance = null;
    let mediaStream = null;
    let videoProcessLoopId = null;

    // 3가지 큼직한 색깔 바구니 (빨강, 노랑, 파랑)
    const BINS = [
      { id: 'red', name: '빨간 통', icon: '🍎', color: '#EF4444', darkColor: '#B91C1C', lightColor: '#FCA5A5', x: 60, y: 400, w: 240, h: 180 },
      { id: 'yellow', name: '노란 통', icon: '⭐', color: '#F59E0B', darkColor: '#B45309', lightColor: '#FDE68A', x: 360, y: 400, w: 240, h: 180 },
      { id: 'blue', name: '파란 통', icon: '🌊', color: '#3B82F6', darkColor: '#1D4ED8', lightColor: '#93C5FD', x: 660, y: 400, w: 240, h: 180 }
    ];

    // 연습용 공 색상 정의
    const BALL_TYPES = [
      { id: 'red', name: '빨간 공', mainColor: '#EF4444', highlightColor: '#FCA5A5', shadowColor: '#991B1B' },
      { id: 'yellow', name: '노란 공', mainColor: '#FBBF24', highlightColor: '#FEF08A', shadowColor: '#B45309' },
      { id: 'blue', name: '파란 공', mainColor: '#3B82F6', highlightColor: '#BAE6FD', shadowColor: '#1E40AF' }
    ];

    let currentBall = {
      ...BALL_TYPES[0],
      x: 480,
      y: 190,
      radius: 65,
      isHeld: false,
      targetX: 480,
      targetY: 190
    };

    let pointer = {
      x: 480,
      y: 300,
      isGrabbing: false,
      visible: false,
      source: 'none'
    };

    // ==========================================
    // 4. MediaPipe Hands 카메라 연동 (WASM 에러 완벽 방지 & getUserMedia 직접 호출)
    // ==========================================
    const MEDIAPIPE_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240";
    let isProcessingFrame = false;

    async function initHandsModel() {
      if (handsInstance) return handsInstance;

      handsInstance = new Hands({
        locateFile: (file) => `${MEDIAPIPE_CDN}/${file}`
      });

      handsInstance.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      handsInstance.onResults(onHandResults);
      return handsInstance;
    }

    async function startCamera() {
      try {
        initAudio();
        camGuideOverlay.style.opacity = '0';
        setTimeout(() => camGuideOverlay.classList.add('hidden'), 300);

        modeBadge.textContent = "카메라 연결 확인 중... 📷";
        modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
        document.getElementById('cam-btn-text').textContent = "카메라 끄기";

        // 1. 브라우저 표준 getUserMedia 직접 호출 (가장 신뢰성 높음)
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("이 브라우저는 카메라 기능을 지원하지 않거나 보안 연결(HTTPS)이 필요합니다.");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 960 },
            height: { ideal: 600 },
            facingMode: 'user'
          },
          audio: false
        });

        mediaStream = stream;
        video.srcObject = stream;
        await video.play();

        // 2. MediaPipe 모델 초기화
        modeBadge.textContent = "AI 손인식 모델 준비 중... ⏳";
        await initHandsModel();

        cameraActive = true;
        modeBadge.textContent = "웹캠 인식 중 🖐️ (화면에 손을 보여주세요!)";
        modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";

        // 3. 비디오 프레임 주기적 전송 루프
        processVideoFrame();
      } catch (err) {
        console.error("카메라 시작 실패:", err);
        cameraActive = false;
        document.getElementById('cam-btn-text').textContent = "카메라 켜기";
        
        let errorMsg = "카메라를 켤 수 없어요! 브라우저 상단 주소창 옆 자물쇠(또는 카메라) 아이콘을 눌러 권한을 [허용]해주세요. 마우스나 터치로도 연습할 수 있어요!";
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          errorMsg = "카메라 사용 권한이 차단되어 있습니다. 주소창의 카메라 권한을 [허용]으로 바꿔주세요!";
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          errorMsg = "연결된 웹캠이나 카메라를 찾을 수 없습니다.";
        }

        showWrongAlert(errorMsg);
        modeBadge.textContent = "마우스 / 스마트보드 터치 모드 🖱️";
        modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-sky-500";
        camGuideOverlay.classList.remove('hidden');
        camGuideOverlay.style.opacity = '1';
      }
    }

    async function processVideoFrame() {
      if (!cameraActive) return;

      if (!isProcessingFrame && video.readyState >= 2 && handsInstance) {
        try {
          isProcessingFrame = true;
          await handsInstance.send({ image: video });
        } catch (e) {
          console.warn("MediaPipe 분석 프레임 스킵:", e);
        } finally {
          isProcessingFrame = false;
        }
      }

      videoProcessLoopId = requestAnimationFrame(processVideoFrame);
    }

    function stopCamera() {
      cameraActive = false;
      if (videoProcessLoopId) {
        cancelAnimationFrame(videoProcessLoopId);
        videoProcessLoopId = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      document.getElementById('cam-btn-text').textContent = "카메라 켜기";
      modeBadge.textContent = "마우스 / 스마트보드 터치 모드 🖱️";
      modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-sky-500";
    }

    function onHandResults(results) {
      if (!cameraActive) return;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        // 거울 모드 (x축 반전: 1 - x)
        pointer.x = (1 - indexTip.x) * canvas.width;
        pointer.y = indexTip.y * canvas.height;
        pointer.visible = true;
        pointer.source = 'hand';

        // 엄지와 검지 끝 사이의 거리로 집기 판정
        const dx = (thumbTip.x - indexTip.x) * canvas.width;
        const dy = (thumbTip.y - indexTip.y) * canvas.height;
        const dist = Math.hypot(dx, dy);

        const previouslyGrabbing = pointer.isGrabbing;
        pointer.isGrabbing = dist < 70; // 70px 미만 시 주먹/잡기

        handlePointerAction(previouslyGrabbing);
      } else {
        if (pointer.source === 'hand') {
          if (currentBall.isHeld) {
            currentBall.isHeld = false;
            checkBinDrop();
          }
          pointer.visible = false;
        }
      }
    }

    function handlePointerAction(previouslyGrabbing) {
      const distToBall = Math.hypot(pointer.x - currentBall.x, pointer.y - currentBall.y);

      // 1. 공 잡기
      if (!previouslyGrabbing && pointer.isGrabbing) {
        if (distToBall < currentBall.radius + 35) {
          currentBall.isHeld = true;
          playSound('grab');
          instructionText.textContent = `"${currentBall.name}"을 꽉 잡았어요! 같은 색 바구니로 출발! 🚀`;
        }
      }

      // 2. 잡은 채로 이동
      if (currentBall.isHeld && pointer.isGrabbing) {
        currentBall.x += (pointer.x - currentBall.x) * 0.45;
        currentBall.y += (pointer.y - currentBall.y) * 0.45;
      }

      // 3. 손 펴기 (놓기)
      if (previouslyGrabbing && !pointer.isGrabbing && currentBall.isHeld) {
        currentBall.isHeld = false;
        checkBinDrop();
      }
    }

    // ==========================================
    // 4-1. 공 생성, 바구니 판정 및 게임 진행 로직
    // ==========================================
    function resetPractice() {
      score = 0;
      scoreDisplay.textContent = score;
      spawnRandomBall();
      instructionText.textContent = "카메라 앞에서 손을 오므려 공을 잡고, 같은 색 바구니로 옮겨보세요! 🎈";
    }

    function spawnRandomBall() {
      const pick = BALL_TYPES[Math.floor(Math.random() * BALL_TYPES.length)];
      currentBall = {
        ...pick,
        x: 480,
        y: 190,
        radius: 65,
        isHeld: false,
        targetX: 480,
        targetY: 190
      };
    }

    function checkBinDrop() {
      let matchedBin = null;
      BINS.forEach(bin => {
        if (currentBall.x >= bin.x && currentBall.x <= bin.x + bin.w &&
            currentBall.y >= bin.y && currentBall.y <= bin.y + bin.h) {
          matchedBin = bin;
        }
      });

      if (matchedBin) {
        if (matchedBin.id === currentBall.id) {
          // 정답 처리!
          playSound('success');
          score++;
          scoreDisplay.textContent = score;
          instructionText.textContent = `딩동댕! 🌟 ${matchedBin.name}에 쏙 들어갔어요! 참 잘했어요!`;
          createBinParticles(matchedBin);
          spawnRandomBall();
        } else {
          // 오답 처리
          playSound('oops');
          showWrongAlert(`"${currentBall.name}"은(는) ${matchedBin.name}이 아니에요! 같은 색깔 통을 찾아보세요!`);
          currentBall.targetX = 480;
          currentBall.targetY = 190;
        }
      } else {
        // 허공에 놓았을 때 제자리로 복귀
        currentBall.targetX = 480;
        currentBall.targetY = 190;
      }
    }

    function showWrongAlert(msg) {
      if (wrongPopupTimer) clearTimeout(wrongPopupTimer);
      wrongPopupDesc.textContent = msg;
      wrongPopup.classList.remove('hidden', 'toast-anim');
      void wrongPopup.offsetWidth; // Reflow 강제 트리거
      wrongPopup.classList.add('toast-anim');

      wrongPopupTimer = setTimeout(() => {
        wrongPopup.classList.add('hidden');
        wrongPopup.classList.remove('toast-anim');
      }, 1600);
    }

    function createBinParticles(bin) {
      const container = canvas.parentElement;
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width / canvas.width;
      const scaleY = rect.height / canvas.height;

      const originX = (bin.x + bin.w / 2) * scaleX;
      const originY = (bin.y + 10) * scaleY;

      const emojis = ['⭐', '✨', '🎉', '🎈', '💖'];
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'pop-particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = `${originX}px`;
        p.style.top = `${originY}px`;

        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        const dist = 60 + Math.random() * 90;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

        container.appendChild(p);
        setTimeout(() => p.remove(), 750);
      }
    }

    // ==========================================
    // 5. 마우스 및 터치 폴백
    // ==========================================
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function onPointerDown(e) {
      const pos = getCanvasCoords(e);
      pointer.x = pos.x;
      pointer.y = pos.y;
      pointer.visible = true;
      pointer.source = 'mouse';
      const prev = pointer.isGrabbing;
      pointer.isGrabbing = true;
      handlePointerAction(prev);
    }

    function onPointerMove(e) {
      if (pointer.source === 'hand') return;
      const pos = getCanvasCoords(e);
      pointer.x = pos.x;
      pointer.y = pos.y;
      pointer.visible = true;
      if (currentBall.isHeld) {
        currentBall.x = pos.x;
        currentBall.y = pos.y;
      }
    }

    function onPointerUp(e) {
      if (pointer.source === 'hand') return;
      const prev = pointer.isGrabbing;
      pointer.isGrabbing = false;
      handlePointerAction(prev);
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (currentBall.isHeld) e.preventDefault(); onPointerMove(e); }, { passive: false });
    window.addEventListener('touchend', (e) => { onPointerUp(e); });

    // ==========================================
    // 6. 메인 렌더링 루프
    // ==========================================
    function renderLoop() {
      // (A) 카메라 화면 또는 가상 배경
      if (cameraActive && video.readyState >= 2) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 아이들이 공과 통을 명확히 볼 수 있도록 밝은 화이트 틴트
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      } else {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, '#EEF2FF');
        bgGrad.addColorStop(0.7, '#E0E7FF');
        bgGrad.addColorStop(1, '#C7D2FE');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 가이드 라인
        ctx.strokeStyle = 'rgba(79, 70, 229, 0.15)';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]);
        ctx.strokeRect(30, 20, canvas.width - 60, 360);
        ctx.setLineDash([]);
      }

      // (B) 3개의 큼직한 색깔 바구니 렌더링
      BINS.forEach(bin => {
        const isHovered = currentBall.isHeld &&
          currentBall.x >= bin.x && currentBall.x <= bin.x + bin.w &&
          currentBall.y >= bin.y && currentBall.y <= bin.y + bin.h;

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.22)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 6;

        const bodyX = bin.x + 12;
        const bodyY = bin.y + 24;
        const bodyW = bin.w - 24;
        const bodyH = bin.h - 24;

        // 원통형 통 본체
        ctx.fillStyle = isHovered ? bin.lightColor : bin.color;
        ctx.beginPath();
        ctx.moveTo(bodyX, bodyY);
        ctx.lineTo(bodyX + bodyW, bodyY);
        ctx.lineTo(bodyX + bodyW - 12, bodyY + bodyH - 12);
        ctx.quadraticCurveTo(bodyX + bodyW / 2, bodyY + bodyH, bodyX + 12, bodyY + bodyH - 12);
        ctx.closePath();
        ctx.fill();

        ctx.lineWidth = isHovered ? 6 : 4;
        ctx.strokeStyle = isHovered ? '#FFD54F' : '#FFFFFF';
        ctx.stroke();

        // 뚜껑 림(Lip)
        ctx.fillStyle = isHovered ? '#FFF9C4' : bin.darkColor;
        ctx.beginPath();
        ctx.roundRect(bin.x, bin.y + 8, bin.w, 20, 10);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        // 손잡이
        ctx.fillStyle = bin.darkColor;
        ctx.beginPath();
        ctx.roundRect(bin.x + bin.w / 2 - 24, bin.y, 48, 12, 6);
        ctx.fill();
        ctx.stroke();

        ctx.restore();

        // 텍스트 & 아이콘 (유아 시인성을 위해 크고 시원하게)
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '52px sans-serif';
        ctx.fillText(bin.icon, bin.x + bin.w / 2, bodyY + 48);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 28px "Jua", sans-serif';
        ctx.fillText(bin.name, bin.x + bin.w / 2, bodyY + 104);

        if (isHovered) {
          ctx.font = 'bold 20px "Jua", sans-serif';
          ctx.fillStyle = '#1E1B4B';
          ctx.fillText('손을 펴세요! 🖐️', bin.x + bin.w / 2, bodyY + 138);
        }
      });

      // (C) 색깔 공 렌더링
      if (!currentBall.isHeld) {
        currentBall.x += (currentBall.targetX - currentBall.x) * 0.12;
        currentBall.y += (currentBall.targetY - currentBall.y) * 0.12;
      }

      ctx.save();
      // 공 그림자
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 10;

      // 입체 구(Sphere) 형태 그라데이션
      const ballGrad = ctx.createRadialGradient(
        currentBall.x - currentBall.radius * 0.3,
        currentBall.y - currentBall.radius * 0.35,
        currentBall.radius * 0.1,
        currentBall.x,
        currentBall.y,
        currentBall.radius
      );
      ballGrad.addColorStop(0, currentBall.highlightColor);
      ballGrad.addColorStop(0.5, currentBall.mainColor);
      ballGrad.addColorStop(1, currentBall.shadowColor);

      ctx.fillStyle = ballGrad;
      ctx.beginPath();
      ctx.arc(currentBall.x, currentBall.y, currentBall.radius, 0, Math.PI * 2);
      ctx.fill();

      // 테두리
      ctx.lineWidth = currentBall.isHeld ? 8 : 5;
      ctx.strokeStyle = currentBall.isHeld ? '#F59E0B' : '#FFFFFF';
      ctx.stroke();

      // 반짝이는 빛 반사 광택
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.beginPath();
      ctx.ellipse(
        currentBall.x - currentBall.radius * 0.35,
        currentBall.y - currentBall.radius * 0.38,
        currentBall.radius * 0.28,
        currentBall.radius * 0.16,
        -Math.PI / 4,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      // 이름표 캡슐 태그
      ctx.save();
      ctx.font = 'bold 28px "Jua", sans-serif';
      const textW = ctx.measureText(currentBall.name).width;
      const tagW = textW + 36;
      const tagH = 46;
      const tagX = currentBall.x - tagW / 2;
      const tagY = currentBall.y + 44;

      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = '#4338CA';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(tagX, tagY, tagW, tagH, 23);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1E1B4B';
      ctx.fillText(currentBall.name, currentBall.x, tagY + tagH / 2 + 1);
      ctx.restore();

      // (D) 손가락 포인터 마법봉 커서
      if (pointer.visible) {
        ctx.save();
        ctx.shadowColor = pointer.isGrabbing ? 'rgba(239, 68, 68, 0.4)' : 'rgba(245, 158, 11, 0.4)';
        ctx.shadowBlur = 15;

        ctx.fillStyle = pointer.isGrabbing ? 'rgba(239, 68, 68, 0.88)' : 'rgba(251, 191, 36, 0.88)';
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, pointer.isGrabbing ? 22 : 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pointer.isGrabbing ? '✊' : '🖐️', pointer.x, pointer.y);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    // ==========================================
    // 7. 이벤트 리스너 등록
    // ==========================================
    document.getElementById('activate-cam-btn').addEventListener('click', () => {
      initAudio();
      startCamera();
    });

    document.getElementById('use-mouse-btn').addEventListener('click', () => {
      initAudio();
      camGuideOverlay.style.opacity = '0';
      setTimeout(() => camGuideOverlay.classList.add('hidden'), 300);
      modeBadge.textContent = "마우스 / 스마트보드 터치 모드 🖱️";
      modeDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-sky-500";
    });

    document.getElementById('cam-toggle-btn').addEventListener('click', () => {
      initAudio();
      if (cameraActive) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    document.getElementById('sound-btn').addEventListener('click', () => {
      isSoundOn = !isSoundOn;
      document.getElementById('sound-icon').textContent = isSoundOn ? '🔔' : '🔕';
      if (isSoundOn) playSound('grab');
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      initAudio();
      resetPractice();
    });

    window.onload = () => {
      resetPractice();
      renderLoop();
    };
  </script>
</body>
